[project]
name = "personal-memory-wiki"
version = "0.1.0"
description = "MCP server for a persistent personal memory wiki"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "markdown-it-py>=3,<4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
